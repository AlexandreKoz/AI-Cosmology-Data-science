name: ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Repository hygiene checks
        run: ./scripts/ci/check_repo_hygiene.sh

  cpu_debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build
      - name: Configure
        run: cmake --preset cpu-only-debug
      - name: Build
        run: cmake --build --preset build-cpu-debug
      - name: Test
        run: ctest --preset test-cpu-debug

  pm_hdf5_fftw_debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install feature dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build pkg-config libhdf5-dev libfftw3-dev
      - name: Configure
        run: cmake --preset pm-hdf5-fftw-debug
      - name: Build
        run: cmake --build --preset build-pm-hdf5-fftw-debug
      - name: Feature-path regression tests
        run: ctest --preset test-pm-hdf5-fftw-debug -R "integration_pm_periodic_mode|unit_snapshot_hdf5_schema"
